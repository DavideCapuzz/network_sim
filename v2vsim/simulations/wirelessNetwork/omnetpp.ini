[General]
network = v2vsim.simulations.wirelessNetwork.WirelessNetwork
description = Gateway System: External Apps ↔ OMNeT++ Wireless ↔ External Apps

sim-time-limit = 300s
cmdenv-express-mode = true
**.cmdenv-log-level = info
**.ipv4.ip.limitedBroadcast = true

# Number of robots (can be 2, 50, 150, etc. - dynamic at runtime)
*.numRobots = 2

# IP Configuration for wireless network
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

# ============================================================================
# MOBILITY: External Control via RobotExternalMobility
# ============================================================================
# Each robot's position is controlled by external Docker app
*.robot[*].mobility.typename = "v2vsim.RobotExternalMobility"
**.robot[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
# Position updates from Docker arrive on these ports
*.robot[*].mobility.listenPort = 8000 + index
*.robot[*].mobility.externalPort = 9000 + index
*.robot[*].mobility.externalHost = "127.0.0.1"
*.robot[*].mobility.maxSpeed = 10mps

# Initial positions (will be overridden by external apps)
*.robot[0].mobility.initialX = 100m
*.robot[0].mobility.initialY = 300m
*.robot[0].mobility.initialZ = 0m
*.robot[1].mobility.initialX = 150m
*.robot[1].mobility.initialY = 300m
*.robot[1].mobility.initialZ = 0m

# ============================================================================
# APPLICATION: Gateway Mode - Relay between Docker and Wireless
# ============================================================================
*.robot[*].numApps = 1
*.robot[*].app[0].typename = "v2vsim.RobotApp"

# WIRELESS V2V: All robots use SAME port for broadcast
*.robot[*].app[0].localPort = 5000
*.robot[*].app[0].remotePort = 5000

# EXTERNAL DOCKER COMMUNICATION: Each robot uses unique ports
# Robot receives messages FROM Docker on port 5000+index
*.robot[*].app[0].externalListenPort = 5000 + parentIndex()

# Robot sends messages TO Docker on port 9000+index
*.robot[*].app[0].externalSendPort = 9000 + parentIndex()
*.robot[*].app[0].externalHost = "127.0.0.1"

# PORT MAPPING SUMMARY:
# Robot 0:
#   - Receives from Docker: UDP 5000
#   - Sends to Docker: UDP 9000
#   - Wireless V2V: port 5000 (broadcast)
#   - Position updates: UDP 8000
#
# Robot 1:
#   - Receives from Docker: UDP 5001
#   - Sends to Docker: UDP 9001
#   - Wireless V2V: port 5000 (broadcast)
#   - Position updates: UDP 8001

# ============================================================================
# WIRELESS CONFIGURATION
# ============================================================================
*.robot[*].numWlanInterfaces = 1
*.robot[*].wlan[0].typename = "Ieee80211Interface"

# Radio configuration
*.robot[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.robot[*].wlan[0].radio.bandName = "2.4 GHz"
*.robot[*].wlan[0].radio.bandwidth = 20MHz
*.robot[*].wlan[0].radio.transmitter.power = 1000mW  # VERY HIGH POWER
*.robot[*].wlan[0].radio.receiver.sensitivity = -100dBm  # VERY SENSITIVE
*.robot[*].wlan[0].radio.receiver.energyDetection = -100dBm
*.robot[*].wlan[0].radio.receiver.snirThreshold = 0dB  # Very permissive

# MAC configuration
*.robot[*].wlan[0].mac.typename = "Ieee80211Mac"
*.robot[*].wlan[0].mac.dcf.typename = "Dcf"
*.robot[*].wlan[0].mac.dcf.channelAccess.typename = "Dcaf"

# Management - ADHOC mode for broadcast (no access point needed)
*.robot[*].wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.robot[*].wlan[0].agent.typename = ""

# ============================================================================
# RADIO MEDIUM
# ============================================================================
*.radioMedium.typename = "Ieee80211ScalarRadioMedium"
*.radioMedium.propagation.typename = "ConstantSpeedPropagation"
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.radioMedium.backgroundNoise.power = -110dBm
*.radioMedium.analogModel.typename = "ScalarAnalogModel"

# ============================================================================
# VISUALIZATION
# ============================================================================
*.visualizer.*.mobilityVisualizer.displayPositions = true
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.*.mediumVisualizer.displaySignals = true
*.visualizer.*.mediumVisualizer.signalColor = "yellow"
*.visualizer.*.dataLinkVisualizer.displayLinks = true
*.visualizer.*.dataLinkVisualizer.packetFilter = "V2V*"
*.visualizer.*.dataLinkVisualizer.lineColor = "green"