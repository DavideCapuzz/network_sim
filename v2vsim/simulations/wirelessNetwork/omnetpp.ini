[General]
network = v2vsim.simulations.wirelessNetwork.WirelessNetwork
description = DIAGNOSTIC - Maximum logging

sim-time-limit = 20s
cmdenv-express-mode = false
**.cmdenv-log-level = trace  # MAXIMUM LOGGING
*.configurator.addStaticAnycastRoutes = true
**.arp.typename = "GlobalArp"
**.ipv4.ip.limitedBroadcast = true


# Number of robots
*.numRobots = 2

# IP Configuration
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

# === MOBILITY: STATIONARY ===
**.robot[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
*.robot[*].mobility.typename = "StationaryMobility"
*.robot[0].mobility.initialX = 100m
*.robot[0].mobility.initialY = 300m
*.robot[1].mobility.initialX = 150m  # Only 50m apart!
*.robot[1].mobility.initialY = 300m

# === APPLICATION: SAME PORT ===
*.robot[*].numApps = 1
*.robot[*].app[0].typename = "v2vsim.RobotApp"
*.robot[*].app[0].localPort = 5000
*.robot[*].app[0].remotePort = 5000

# === WIRELESS - SIMPLIFIED ===
*.robot[*].numWlanInterfaces = 1
*.robot[*].wlan[0].typename = "Ieee80211Interface"

# Radio - HIGH POWER
*.robot[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.robot[*].wlan[0].radio.bandName = "2.4 GHz"
*.robot[*].wlan[0].radio.bandwidth = 20MHz
*.robot[*].wlan[0].radio.transmitter.power = 1000mW  # VERY HIGH POWER
*.robot[*].wlan[0].radio.receiver.sensitivity = -100dBm  # VERY SENSITIVE
*.robot[*].wlan[0].radio.receiver.energyDetection = -100dBm
*.robot[*].wlan[0].radio.receiver.snirThreshold = 0dB  # Very permissive

# MAC
*.robot[*].wlan[0].mac.typename = "Ieee80211Mac"
*.robot[*].wlan[0].mac.dcf.typename = "Dcf"
*.robot[*].wlan[0].mac.dcf.channelAccess.typename = "Dcaf"

# Management - Adhoc
*.robot[*].wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.robot[*].wlan[0].agent.typename = ""

# === RADIO MEDIUM ===
*.radioMedium.typename = "Ieee80211ScalarRadioMedium"
*.radioMedium.propagation.typename = "ConstantSpeedPropagation"
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.radioMedium.backgroundNoise.power = -110dBm

# === VERBOSE LOGGING ===
*.robot[*].app[0].**.displayStringTextFormat = "sent: %s, rcvd: %r"
*.robot[*].udp.**.displayStringTextFormat = "sent: %s, rcvd: %r"

# Log every layer
**.udp.verbose = true
**.ipv4.verbose = true
**.wlan[0].mac.verbose = true
**.wlan[0].radio.verbose = true