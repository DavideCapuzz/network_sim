[General]
description = N robots communicating wirelessly
network = WirelessNetwork

# Maximum simulation time before stopping.
sim-time-limit = 300s
# user-interface
#   Qtenv → graphical simulator
#   Cmdenv → command-line only
#user-interface = Qtenv

# define the number of robots
*.numRobots = 2

################################
# Logging
################################
# cmdenv-express-mode speeds up command-line logging.
cmdenv-express-mode = true
# **.cmdenv-log-level: sets verbosity.
**.cmdenv-log-level = info
# *.radio.displayReception and *.radio.displayTransmission trigger detailed radio PHY logs so you can see when PHY receives or transmits signals.
**.radio.displayReception = true
**.radio.displayTransmission = true

################################
# IP addressing
################################
# This uses Ipv4NetworkConfigurator to automatically assign IPv4 addresses to all hosts matching
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

################################
# Wireless Interface
################################
# for each robot setup only one network
*.robot*.numWlanInterfaces = 1
# Uses a simple scalar transmission power model base on the 802.11
# https://doc.omnetpp.org/inet/api-4.4.0/neddoc/inet.physicallayer.wireless.ieee80211.packetlevel.Ieee80211ScalarRadio.html
*.robot*.wlan[0].typename = "Ieee80211Interface"
*.robot*.wlan[0].radio.typename = "Ieee80211ScalarRadio"
# Wi-Fi band. Supported values include "2.4 GHz", "5 GHz"
*.robot*.wlan[0].radio.bandName = "2.4 GHz"
# Defines power in mW. Larger power increases range; lower reduces it.
*.robot*.wlan[0].radio.transmitter.power = 2mW
# sensitivity: minimum power where reception is attempted.
*.robot*.wlan[0].radio.receiver.sensitivity = -85dBm
# noiseFloor: baseline noise level.
*.robot*.wlan[0].radio.receiver.noiseFloor = -110dBm
# energyDetection: threshold above which channel considered busy.
*.robot*.wlan[0].radio.receiver.energyDetection = -90dBm
# When false, the radio accounts for interference from other simultaneous transmissions.
# Turning this off artificially simplifies the channel but may allow unrealistic reception.
# TODO try with true
*.robot*.wlan[0].radio.receiver.ignoreInterference = false
# TODO do i need really this
*.robot*.wlan[0].radio.transmitter.communicationRange = 150m
################################
# MAC
################################
# https://inet.omnetpp.org/docs/users-guide/ch-80211.html
# Typical 802.11 MAC implementation.
*.robot*.wlan[0].mac.typename = "Ieee80211Mac"
# Uses CSMA/CA DCF channel access function.
*.robot*.wlan[0].mac.dcf.channelAccess.typename = "Dcaf"
# control MAC behavior: ACK use, duplex mode, and header byte size.
*.robot*.wlan[0].mac.useAck = false
*.robot*.wlan[0].mac.fullDuplex = false
*.robot*.wlan[0].mac.headerLength = 23B

################################
# Applications
################################
# Each robot runs a UDP app that periodically sends packets.
*.robot*.numApps = 1
*.robot*.app[0].typename = "UdpBasicApp"
# Setting destAddresses = "255.255.255.255" makes it broadcast to all IPs in subnet.
*.robot*.app[0].destAddresses = "255.255.255.255"
*.robot*.app[0].destPort = 5000
*.robot*.app[0].localPort = 5000
*.robot*.app[0].messageLength = 500B
*.robot*.app[0].sendInterval = exponential(1s)
*.robot*.app[0].packetName = "UDPData"

################################
# Mobility (ALL robots)
################################
# initFromDisplayString = false ensures drawn position comes from mobility values (meters), not fixed NED display string.
*.robot[*].mobility.initFromDisplayString = false
# StationaryMobility fixes the robot in place.
*.robot[*].mobility.typename = "StationaryMobility"
*.robot[0].mobility.initialX = 400m
*.robot[0].mobility.initialY = 300m
*.robot[*].mobility.initialZ = 0m
*.robot[1].mobility.initialX = 100m
*.robot[1].mobility.initialY = 200m
############################
# Visualization
################################
# Shows robot positions and movement trails.
*.visualizer.*.mobilityVisualizer.displayPositions = true
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true

# Shows animated propagating radio waves as expanding rings.
# Additional flags show departures and arrivals:
*.visualizer.*.mediumVisualizer.displaySignals = true
*.visualizer.*.mediumVisualizer.displaySignalPropagation = true
*.visualizer.*.mediumVisualizer.displaySignalDepartures = true
*.visualizer.*.mediumVisualizer.displaySignalArrivals = true
*.visualizer.*.mediumVisualizer.signalShape = "ring"
*.visualizer.*.mediumVisualizer.signalPropagationAnimationSpeed = 5

*.visualizer.*.physicalLinkVisualizer.displayLinks = true
*.visualizer.*.physicalLinkVisualizer.packetFilter = "UDPData*"
*.visualizer.*.mediumVisualizer.signalColor = "red"
*.visualizer.*.mediumVisualizer.fadeOutMode = "simulationTime"

################################
# Radio Medium
################################
# https://doc.omnetpp.org/inet/api-4.4.0/neddoc/inet.physicallayer.wireless.ieee80211.packetlevel.Ieee80211ScalarRadioMedium.html
*.radioMedium.backgroundNoiseLevel = -110dBm
# Controls how the medium aggregates signals and interference.
#"scalar" makes the medium combine signals in a scalar field suitable for array radios and simple interference computation
*.radioMedium.interferenceMode = "scalar"
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
# These enable Log-Normal fading with path loss exponent alpha.
*.radioMedium.pathLoss.alpha = 2
################################
# Ranges
################################
**.radio.displayCommunicationRange = true
