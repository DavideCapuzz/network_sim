[General]
network = v2vsim.simulations.wirelessNetwork.WirelessNetwork
description = Multi-robot wireless communication with Docker integration

sim-time-limit = 300s
cmdenv-express-mode = true
**.cmdenv-log-level = info

# Number of robots
*.numRobots = 2

# IP Configuration
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

# Mobility settings (per robot, ports auto-assigned by index)
*.robot[*].mobility.maxSpeed = 10mps
*.robot[*].mobility.externalHost = "127.0.0.1"
# Set initial positions (spread robots out)
*.robot[0].mobility.initialX = 100m
*.robot[0].mobility.initialY = 300m
*.robot[0].mobility.initialZ = 0m
*.robot[1].mobility.initialX = 200m
*.robot[1].mobility.initialY = 300m
*.robot[1].mobility.initialZ = 0m
# Ports are set in .ned file based on index

# Application Settings (per robot, ports auto-assigned by index)
*.robot[*].app[0].externalHost = "127.0.0.1"
# Ports are set in .ned file based on index

# Wireless configuration
*.robot[*].numWlanInterfaces = 1
*.robot[*].wlan[0].typename = "Ieee80211Interface"
*.robot[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.robot[*].wlan[0].radio.bandName = "2.4 GHz"
*.robot[*].wlan[0].radio.transmitter.power = 20mW
*.robot[*].wlan[0].radio.receiver.sensitivity = -85dBm
*.robot[*].wlan[0].radio.receiver.ignoreInterference = false

# Communication range (this determines the radius visualization)
*.robot[*].wlan[0].radio.transmitter.communicationRange = 200m
*.robot[*].wlan[0].radio.displayCommunicationRange = true

# MAC configuration
*.robot[*].wlan[0].mac.typename = "Ieee80211Mac"
*.robot[*].wlan[0].mac.dcf.channelAccess.typename = "Dcaf"

# Visualization - Display Settings
*.visualizer.*.mobilityVisualizer.displayPositions = true
*.visualizer.*.mobilityVisualizer.displayOrientations = true
*.visualizer.*.mobilityVisualizer.displayVelocities = true
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true

# Communication range visualization (show circles around robots)
*.visualizer.*.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.*.mediumVisualizer.displayInterferenceRanges = false

# Signal visualization
*.visualizer.*.mediumVisualizer.displaySignals = true
*.visualizer.*.mediumVisualizer.signalColor = "yellow"
*.visualizer.*.mediumVisualizer.signalPropagationAnimationSpeed = 1000

# Data link visualization (show when robots communicate)
*.visualizer.*.dataLinkVisualizer.displayLinks = true
*.visualizer.*.dataLinkVisualizer.packetFilter = "wlan*"

# Radio medium visualization
*.radioMedium.propagation.typename = "ConstantSpeedPropagation"
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"