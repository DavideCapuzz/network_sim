# =====================================================================
# 3. docker-compose.yml (Based on your existing + aggregator)
# =====================================================================
# FILE: docker-compose.yml
---
services:
  # Main OMNeT++ development container
  omnetpp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OMNET_VERSION: "6.0.1"
        INET_VERSION: "4.5.2"
        VARIANT: "22.04"
        USER_UID: 1000
        USER_GID: 1000

    container_name: omnetpp-dev
    hostname: omnetpp-dev

    # Resource limits for 150 robots
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 16G

    # Increased shared memory
    shm_size: 4gb

    volumes:
      - .:/home/ubuntu/src:rw
      - omnetpp-results:/home/ubuntu/results:rw

    ports:
      - "6083:6083"      # noVNC
      - "5900:5900"      # VNC direct

    networks:
      robot-network:
        ipv4_address: 172.25.0.10

    environment:
      NOVNC_PORT: 6083
      DISPLAY: ":1"
      VNC_RESOLUTION: "1920x1080"

      # Performance settings
      OMP_NUM_THREADS: 16
      OMNETPP_THREAD_COUNT: 16

      # Service discovery
      POSITION_AGGREGATOR_HOST: position-aggregator
      POSITION_AGGREGATOR_PORT: 9999

    depends_on:
      - position-aggregator

    # Kernel tuning for network performance
    sysctls:
      - net.core.rmem_max=134217728
      - net.core.wmem_max=134217728
      - net.ipv4.udp_mem=65536 131072 262144
      - net.core.netdev_max_backlog=5000

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # C++ Position Aggregator (high performance)
  position-aggregator:
    build:
      context: ./aggregator
      dockerfile: Dockerfile.aggregator

    container_name: position-aggregator
    hostname: position-aggregator

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

    ports:
      - "9999:9999/udp"    # OMNeT++ queries
      - "10000:10000/udp"  # External robot updates
      - "8080:8080"        # HTTP status API

    networks:
      robot-network:
        ipv4_address: 172.25.0.20

    environment:
      OMNETPP_PORT: 9999
      EXTERNAL_PORT: 10000
      HTTP_PORT: 8080
      NUM_ROBOTS: 150
      LOG_LEVEL: "INFO"

    # Kernel tuning
    sysctls:
      - net.core.rmem_max=134217728
      - net.core.wmem_max=134217728
      - net.ipv4.udp_mem=65536 131072 262144

volumes:
  omnetpp-results:
    driver: local

networks:
  robot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1